<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11.44 4.4">
  <defs>
    <clipPath id="houseBodyClip">
      <path d="M0.45,1.55 L10.99,1.55 Q11.14,1.55 11.14,1.70 L11.14,4.4 L0.3,4.4 L0.3,1.70 Q0.3,1.55 0.45,1.55 Z"/>
    </clipPath>
  </defs>

  <!-- roof -->
  <polygon points="0.05,1.35 4.7,0.09 4.7,1.35" fill="#F2E2C0"/>
  <polygon points="4.7,0.09 11.39,1.35 4.7,1.35" fill="#7E93A8"/>
  <polygon points="4.62,0.09 4.78,0.09 4.78,0.48 4.62,0.48" fill="#B7C1CC" opacity="0.85"/>
  <polygon points="0.05,1.35 0.32,1.35 0.05,1.02" fill="#FFE2B0" opacity="0.9"/>

  <!-- fascia / eave band -->
  <rect x="0.05" y="1.35" width="4.45" height="0.2" fill="#FFF8EC"/>
  <rect x="4.5" y="1.35" width="0.25" height="0.2" fill="#D2DAE1"/>
  <rect x="4.75" y="1.35" width="6.64" height="0.2" fill="#A3B7C9"/>

  <!-- chimney (behind body/roof line so base is hidden) -->
  <rect x="8.3" y="0.25" width="0.5" height="0.85" rx="0.04" fill="#B5674A"/>
  <rect x="8.2" y="0.2" width="0.7" height="0.15" rx="0.03" fill="#8F4E38"/>

  <!-- body bands, clipped to rounded-top silhouette -->
  <g clip-path="url(#houseBodyClip)">
    <rect x="0.3" y="1.55" width="4.2" height="1.65" fill="#FBF3E4"/>
    <rect x="4.5" y="1.55" width="0.25" height="1.65" fill="#C6CFD8"/>
    <rect x="4.75" y="1.55" width="6.39" height="1.65" fill="#93A9BE"/>

    <rect x="0.3" y="3.2" width="4.2" height="1.2" fill="#F0E4CC"/>
    <rect x="4.5" y="3.2" width="0.25" height="1.2" fill="#B7C1CC"/>
    <rect x="4.75" y="3.2" width="6.39" height="1.2" fill="#7E96AC"/>

    <rect x="0.3" y="1.55" width="0.17" height="2.85" fill="#FFE2B0" opacity="0.9"/>
  </g>

  <!-- attic gable window -->
  <rect x="4.55" y="0.65" width="0.5" height="0.38" rx="0.08" ry="0.08" fill="#FFD98A" opacity="0.5"/>

  <!-- ground-floor windows -->
  <rect x="1.4" y="2.95" width="1.3" height="1.05" rx="0.12" ry="0.12" fill="#FFD98A" opacity="0.9"/>
  <rect x="8.3" y="2.95" width="1.3" height="1.05" rx="0.12" ry="0.12" fill="#FFD98A" opacity="0.6"/>

  <!-- front door -->
  <path d="M5.02,2.9 L5.63,2.9 Q5.75,2.9 5.75,3.02 L5.75,4.4 L4.9,4.4 L4.9,3.02 Q4.9,2.9 5.02,2.9 Z" fill="#8B5A3C"/>
</svg>
